<div [class.dark]="themeService.isDark()" class="min-h-screen">
  <div class="bg-[#F8F7F4] dark:bg-[#161614] text-stone-850 dark:text-stone-100 min-h-screen transition-colors duration-200">
    <div class="max-w-2xl mx-auto px-4 py-8 sm:py-12 flex flex-col min-h-screen">
      
      <!-- Top Header with Role Switcher, Notifications & Theme Toggle -->
      <app-header />

      <!-- Submit Idea Pill / Expanded Card -->
      <app-idea-submit />

      <!-- Filter Tabs, Search & Sort Toolbar -->
      <app-idea-toolbar />

      <!-- Ideas Feed / List -->
      <main class="space-y-3 flex-1 mb-8">
        @for (idea of ideaService.filteredIdeas(); track idea.id) {
          <app-idea-card [idea]="idea" />
        } @empty {
          <div class="bg-white/60 dark:bg-stone-900/40 rounded-2xl p-8 sm:p-12 text-center border border-dashed border-stone-200 dark:border-stone-800 transition-colors">
            <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-stone-100 dark:bg-stone-800 flex items-center justify-center text-stone-400">
              <svg class="w-6 h-6 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 001.5-.189m-1.5.189a6.01 6.01 0 01-1.5-.189m3.75 7.478a12.06 12.06 0 01-4.5 0m3.75 2.383a14.406 14.406 0 01-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 10-7.516 0c.85.493 1.508 1.333 1.508 2.316V18" />
              </svg>
            </div>
            <h3 class="text-sm font-semibold text-stone-700 dark:text-stone-300 mb-1">
              No ideas matching your criteria
            </h3>
            <p class="text-xs text-stone-400 dark:text-stone-500 max-w-sm mx-auto">
              Try adjusting your search query, selecting "All" statuses, or be the first to submit a new feature request above.
            </p>
          </div>
        }
      </main>

      <!-- Detail Modal Drawer -->
      <app-idea-detail />

      <!-- Subdued Footer -->
      <footer class="mt-auto text-center py-4 border-t border-stone-200/40 dark:border-stone-850">
        <p class="text-[11px] text-stone-400 dark:text-stone-500 tracking-wide">
          IdeaHub · Product Idea & Feedback System · All data synced to localStorage
        </p>
      </footer>

    </div>
  </div>
</div>
