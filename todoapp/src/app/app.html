<div [class.dark]="themeService.isDark()" class="min-h-screen bg-[#F8F7F4] dark:bg-[#161614] text-stone-800 dark:text-stone-100 transition-colors duration-200 antialiased selection:bg-stone-200 selection:text-stone-900">
  
  <div class="max-w-xl mx-auto px-4 sm:px-6 py-8 sm:py-14 space-y-4 sm:space-y-5">
    
    <!-- Title & Date Header -->
    <app-header />

    <!-- Add Task Input Pill -->
    <app-todo-input />

    <!-- Section Header (ACTIVE / Filters / Sort) -->
    <app-todo-toolbar />

    <!-- Tasks List -->
    <app-todo-list />

    <!-- Footer Stats -->
    @if (todoService.totalCount() > 0) {
      <footer class="pt-6 text-center text-[11px] text-stone-400 dark:text-stone-600">
        {{ todoService.totalCount() }} task{{ todoService.totalCount() === 1 ? '' : 's' }} · auto-saved locally
      </footer>
    }

  </div>

</div>
